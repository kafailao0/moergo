CONFIG_ZMK_POINTING=y

# Per-key / per-layer RGB indicator support (darknao / DunderXIII rgb-layer-26.09)
CONFIG_EXPERIMENTAL_RGB_LAYER=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# Turn off RGB underglow across all modes after 30 minutes of inactivity (ms)
CONFIG_ZMK_RGB_UNDERGLOW_IDLE_TIMEOUT=1800000
