name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: DunderXIII/zmk
          ref: rgb-layer-26.09
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Glove80 combined firmware
        run: |
          nix-build glove80/config -o combined-glove80
          cp combined-glove80/glove80.uf2 glove80.uf2
      - name: Build Go60 combined firmware
        run: |
          nix-build go60/config -o combined-go60
          cp combined-go60/go60.uf2 go60.uf2
      - name: Upload Glove80 firmware
        uses: actions/upload-artifact@v4
        with:
          name: glove80.uf2
          path: glove80.uf2
      - name: Upload Go60 firmware
        uses: actions/upload-artifact@v4
        with:
          name: go60.uf2
          path: go60.uf2
